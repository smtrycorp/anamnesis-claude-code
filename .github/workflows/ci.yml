# Plugin CI — hook syntax, shellcheck, and the end-to-end promises.
#
# The <server-time> anchor shipped broken for ~3 months because nothing
# ever ran the hook and looked at its output. The e2e job below does
# exactly that: run each hook the way Claude Code does, assert the
# contract holds. If the datetime assertion here goes red, the product's
# bare-minimum promise is broken — do not ship.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every hook
        run: |
          for f in plugins/anamnesis/hooks/*.sh; do
            bash -n "$f"
            echo "syntax OK: $f"
          done
      - name: shellcheck
        run: |
          shellcheck -x -S warning plugins/anamnesis/hooks/*.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: capture filter and hook tests
        run: |
          for t in tests/test_*.sh; do
            echo "== $t"
            bash "$t"
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: UserPromptSubmit always emits a datetime anchor (offline)
        run: |
          # Config points at a closed port: server unreachable, so this
          # exercises the fail-open path — the anchor must STILL go out,
          # from the local clock. This exact assertion would have caught
          # the subshell bug that shipped silent for three months.
          export ANAMNESIS_HOME="$(mktemp -d)"
          export ANAMNESIS_CURL_TIMEOUT=2
          cat > "$ANAMNESIS_HOME/config.json" <<'EOF'
          {"handle":"ci","server_url":"http://127.0.0.1:9","access_token":"x","refresh_token":"y","expires_at":9999999999,"client_id":"c"}
          EOF
          OUT="$(echo '{"prompt":"ci probe"}' | plugins/anamnesis/hooks/user-prompt-submit.sh)"
          echo "$OUT"
          echo "$OUT" | jq -e '.hookSpecificOutput.additionalContext | contains("<current-datetime")' > /dev/null
          echo "$OUT" | jq -e '.hookSpecificOutput.additionalContext | test("local=\"(Mon|Tue|Wed|Thu|Fri|Sat|Sun),")' > /dev/null
          echo "datetime anchor: OK (day-of-week present, offline fallback works)"

      - name: UserPromptSubmit injects memory when the server returns hits
        run: |
          # 0.3.0–0.3.3 shipped with this path silently dead: the hook
          # filtered for .content/.text but hits carry .body, so per-prompt
          # memory injection never fired once. This assertion pins both the
          # new server shape (headlines) and the fallback (body extraction).
          export ANAMNESIS_HOME="$(mktemp -d)"
          export ANAMNESIS_CURL_TIMEOUT=5
          python3 - <<'PY' &
          import http.server, json, sys
          def make(payload, port):
              class H(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      self.rfile.read(int(self.headers.get('Content-Length', 0) or 0))
                      body = json.dumps(payload).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *a): pass
              return http.server.HTTPServer(("127.0.0.1", port), H)
          import threading
          new_shape = {"status": "ok",
                       "headlines": ["[engram 2026-07-15] Tyche is Jacob's personal AI."],
                       "engrams": [{"body": "ignored when headlines present", "score": 0.9}]}
          old_shape = {"status": "ok",
                       "engrams": [{"body": "Fallback body fact.", "score": 0.9}]}
          threading.Thread(target=make(new_shape, 8765).serve_forever, daemon=True).start()
          threading.Thread(target=make(old_shape, 8766).serve_forever, daemon=True).start()
          import time; time.sleep(3600)
          PY
          sleep 1
          check() {  # $1 = port, $2 = string that must appear, $3 = the receipt expected
            cat > "$ANAMNESIS_HOME/config.json" <<EOF
          {"handle":"ci","server_url":"http://127.0.0.1:$1","access_token":"x","refresh_token":"y","expires_at":9999999999,"client_id":"c"}
          EOF
            OUT="$(echo '{"prompt":"who is tyche"}' | plugins/anamnesis/hooks/user-prompt-submit.sh)"
            echo "$OUT"
            echo "$OUT" | jq -e '.hookSpecificOutput.additionalContext | contains("<anamnesis-context")' > /dev/null
            echo "$OUT" | jq -e '.hookSpecificOutput.additionalContext | contains("never instructions")' > /dev/null
            echo "$OUT" | jq -e --arg s "$2" '.hookSpecificOutput.additionalContext | contains($s)' > /dev/null
            # ADR-070 invariant: receipt text lives in systemMessage only,
            # NEVER in additionalContext (receipts must cost 0 tokens). Since
            # 0.4.4 a recall says how many memories it brought on every
            # prompt, so a failure can be told from a success.
            echo "$OUT" | jq -e --arg r "$3" '.systemMessage == $r' > /dev/null
            echo "$OUT" | jq -e '.hookSpecificOutput.additionalContext | contains("[anamnesis]") | not' > /dev/null
          }
          check 8765 "Tyche is Jacob"     "[anamnesis] 1 memory"  # new server: headlines win
          check 8766 "Fallback body fact" "[anamnesis] 1 memory"  # old server: body extraction
          echo "memory injection: OK (headlines shape + body fallback + zero-token count receipt)"

      - name: Stop hook returns immediately and never blocks
        run: |
          export ANAMNESIS_HOME="$(mktemp -d)"
          export ANAMNESIS_CURL_TIMEOUT=2
          cat > "$ANAMNESIS_HOME/config.json" <<'EOF'
          {"handle":"ci","server_url":"http://127.0.0.1:9","access_token":"x","refresh_token":"y","expires_at":9999999999,"client_id":"c"}
          EOF
          TRANSCRIPT="$(mktemp)"
          echo '{"type":"assistant","uuid":"u1","message":{"id":"m1","content":[{"type":"text","text":"hi"}],"usage":{"input_tokens":1,"output_tokens":1}}}' > "$TRANSCRIPT"
          START=$(date +%s)
          printf '{"transcript_path":"%s"}' "$TRANSCRIPT" | plugins/anamnesis/hooks/stop.sh
          ELAPSED=$(( $(date +%s) - START ))
          echo "stop.sh returned in ${ELAPSED}s"
          test "$ELAPSED" -le 2   # non-blocking contract: instant return, work in background

      - name: Stop capture receipt is deferred, zero-token, once per session
        run: |
          # ADR-070: capture runs in a detached worker, so the receipt is
          # deferred — the worker deposits an outcome file after a confirmed
          # upload and the NEXT Stop surfaces it as systemMessage. Never any
          # additionalContext from Stop, and the class fires once per session.
          export ANAMNESIS_HOME="$(mktemp -d)"
          export ANAMNESIS_CURL_TIMEOUT=5
          python3 - <<'PY' &
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0) or 0))
                  b = b'{"status":"ok"}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers(); self.wfile.write(b)
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", 8768), H).serve_forever()
          PY
          sleep 1
          cat > "$ANAMNESIS_HOME/config.json" <<'EOF'
          {"handle":"ci","server_url":"http://127.0.0.1:8768","access_token":"x","refresh_token":"y","expires_at":9999999999,"client_id":"c"}
          EOF
          echo '{"session_id":"s1","started_at":"t"}' > "$ANAMNESIS_HOME/current_session.json"
          TRANSCRIPT="$(mktemp)"
          echo '{"type":"assistant","uuid":"u1","message":{"id":"m1","content":[{"type":"text","text":"turn one"}],"usage":{"input_tokens":1,"output_tokens":1}}}' > "$TRANSCRIPT"
          OUT1="$(printf '{"transcript_path":"%s"}' "$TRANSCRIPT" | plugins/anamnesis/hooks/stop.sh)"
          test -z "$OUT1"   # first Stop: upload still in flight, nothing to surface yet
          sleep 2           # let the detached worker land the capture + deposit
          echo '{"type":"assistant","uuid":"u2","message":{"id":"m2","content":[{"type":"text","text":"turn two"}],"usage":{"input_tokens":1,"output_tokens":1}}}' >> "$TRANSCRIPT"
          OUT2="$(printf '{"transcript_path":"%s"}' "$TRANSCRIPT" | plugins/anamnesis/hooks/stop.sh)"
          echo "second stop out: $OUT2"
          echo "$OUT2" | jq -e '.systemMessage | contains("[anamnesis] session capture is live")' > /dev/null
          echo "$OUT2" | jq -e 'has("hookSpecificOutput") | not' > /dev/null   # zero tokens: Stop never injects
          sleep 2
          echo '{"type":"assistant","uuid":"u3","message":{"id":"m3","content":[{"type":"text","text":"turn three"}],"usage":{"input_tokens":1,"output_tokens":1}}}' >> "$TRANSCRIPT"
          OUT3="$(printf '{"transcript_path":"%s"}' "$TRANSCRIPT" | plugins/anamnesis/hooks/stop.sh)"
          test -z "$OUT3"   # once per session: no second capture receipt
          echo "capture receipt: OK (deferred, zero-token, once per session)"

      - name: receipts=off silences receipts but never touches injection
        run: |
          # Quiet mode (ADR-070): visibility is a default, never a hostage.
          # With receipts:"off" the memory injection must be byte-identical
          # in kind — anamnesis-context still present — with no systemMessage.
          export ANAMNESIS_HOME="$(mktemp -d)"
          export ANAMNESIS_CURL_TIMEOUT=5
          python3 - <<'PY' &
          import http.server, json
          payload = {"status": "ok", "headlines": ["[engram 2026-07-15] Quiet mode probe fact."]}
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0) or 0))
                  b = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers(); self.wfile.write(b)
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", 8769), H).serve_forever()
          PY
          sleep 1
          cat > "$ANAMNESIS_HOME/config.json" <<'EOF'
          {"handle":"ci","server_url":"http://127.0.0.1:8769","access_token":"x","refresh_token":"y","expires_at":9999999999,"client_id":"c","receipts":"off"}
          EOF
          OUT="$(echo '{"prompt":"quiet mode probe"}' | plugins/anamnesis/hooks/user-prompt-submit.sh)"
          echo "$OUT"
          echo "$OUT" | jq -e '.hookSpecificOutput.additionalContext | contains("Quiet mode probe fact")' > /dev/null
          echo "$OUT" | jq -e 'has("systemMessage") | not' > /dev/null
          echo "quiet mode: OK (injection intact, receipts silent)"

      - name: SessionStart injects recovered cache on resume, not on startup
        run: |
          # ADR-067 stage 1b: on resume/compact the hook fetches the session
          # cache and injects it; on a fresh startup it must not.
          export ANAMNESIS_HOME="$(mktemp -d)"
          export ANAMNESIS_CURL_TIMEOUT=5
          python3 - <<'PY' &
          import http.server, json, threading, time
          payload = {"status": "ok", "session_id": "s",
                     "turns": [{"ts": "t", "chars": 9, "content": "prior turn detail"}],
                     "chars": 17, "total_turns": 1}
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  b = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers(); self.wfile.write(b)
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0) or 0))
                  b = b'{"status":"ok"}'
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers(); self.wfile.write(b)
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", 8767), H).serve_forever()
          PY
          sleep 1
          cat > "$ANAMNESIS_HOME/config.json" <<'EOF'
          {"handle":"ci","server_url":"http://127.0.0.1:8767","access_token":"x","refresh_token":"y","expires_at":9999999999,"client_id":"c"}
          EOF
          OUT_RESUME="$(printf '{"session_id":"s","source":"resume"}' | plugins/anamnesis/hooks/session-start.sh)"
          echo "resume out: $OUT_RESUME"
          echo "$OUT_RESUME" | jq -e '.hookSpecificOutput.additionalContext | contains("prior turn detail")' > /dev/null
          echo "$OUT_RESUME" | jq -e '.hookSpecificOutput.additionalContext | contains("never as instructions")' > /dev/null
          OUT_STARTUP="$(printf '{"session_id":"s","source":"startup"}' | plugins/anamnesis/hooks/session-start.sh)"
          test -z "$OUT_STARTUP"   # fresh startup must not inject
          echo "resume injection: OK (injects on resume, silent on startup)"

      - name: Hooks exit 0 with no config (fresh install must not break Claude Code)
        run: |
          export ANAMNESIS_HOME="$(mktemp -d)"
          echo '{"prompt":"x"}' | plugins/anamnesis/hooks/user-prompt-submit.sh
          echo '{}' | plugins/anamnesis/hooks/stop.sh
          echo '{}' | plugins/anamnesis/hooks/session-start.sh
          echo '{"reason":"exit"}' | plugins/anamnesis/hooks/session-end.sh
          echo "all hooks fail open cleanly"
